<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your Sleep Outside order securely.">
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>

  <header class="divider">
    <div class="logo">
      <img src="/images/noun_Tent_2517.svg" alt="Tent logo">
      <a href="/index.html">
        Sleep <span class="highlight">Outside</span>
      </a>
    </div>
  </header>

  <main class="divider">

    <section class="products">
      <h1>Review & Place Your Order</h1>

      <form id="checkout-form">

        <label for="fname">First Name</label>
        <input
          type="text"
          id="fname"
          name="fname"
          autocomplete="given-name"
          required
        >

        <label for="lname">Last Name</label>
        <input
          type="text"
          id="lname"
          name="lname"
          autocomplete="family-name"
          required
        >

        <label for="street">Street Address</label>
        <input
          type="text"
          id="street"
          name="street"
          autocomplete="street-address"
          required
        >

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          name="city"
          autocomplete="address-level2"
          required
        >

        <label for="state">State / Province</label>
        <input
          type="text"
          id="state"
          name="state"
          autocomplete="address-level1"
          required
        >

        <label for="zip">Postal Code</label>
        <input
          type="text"
          id="zip"
          name="zip"
          autocomplete="postal-code"
          required
        >

        <label for="cardNumber">Credit Card Number</label>
        <input
          type="text"
          id="cardNumber"
          name="cardNumber"
          inputmode="numeric"
          autocomplete="cc-number"
          pattern="[0-9 ]{13,23}"
          title="Enter a valid card number"
          required
        >

        <label for="expiration">Expiration Date</label>
        <input
          type="text"
          id="expiration"
          name="expiration"
          placeholder="MM/YY"
          autocomplete="cc-exp"
          pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
          title="Enter expiration as MM/YY"
          required
        >

        <label for="code">Security Code</label>
        <input
          type="text"
          id="code"
          name="code"
          inputmode="numeric"
          autocomplete="cc-csc"
          pattern="[0-9]{3,4}"
          title="Enter a 3 or 4 digit security code"
          required
        >

        <button type="submit" id="checkoutSubmit">
          Place Order
        </button>

      </form>
    </section>

  </main>

  <footer>
    &copy; NOT a real business
  </footer>

</body>
</html>
